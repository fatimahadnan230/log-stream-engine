<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NexusLog | Distributed Stream Engine</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen font-mono p-6">

  <!-- Header -->
  <header class="max-w-5xl mx-auto flex justify-between items-center pb-6 border-b border-zinc-800">
    <div class="flex items-center space-x-3">
      <div class="w-3 h-3 bg-emerald-500 rounded-full animate-ping"></div>
      <span class="font-bold text-lg tracking-wider text-white">NEXUS_LOG // ENGINE_v2.4</span>
    </div>
    <div class="text-xs text-zinc-500">
      THROUGHPUT: <span id="tps" class="text-emerald-400 font-bold">0</span> MSG/SEC
    </div>
  </header>

  <!-- Main Grid -->
  <main class="max-w-5xl mx-auto grid md:grid-cols-3 gap-6 my-8">
    
    <!-- Metrics Panel -->
    <div class="md:col-span-1 space-y-4">
      <div class="bg-zinc-900 border border-zinc-800 p-4 rounded-lg">
        <div class="text-xs text-zinc-500 uppercase tracking-widest">Pipeline Health</div>
        <div class="text-2xl font-bold text-emerald-400 mt-1">99.98%</div>
        <div class="w-full bg-zinc-800 h-1.5 rounded-full mt-3 overflow-hidden">
          <div class="bg-emerald-500 h-full w-[99.98%]"></div>
        </div>
      </div>

      <div class="bg-zinc-900 border border-zinc-800 p-4 rounded-lg">
        <div class="text-xs text-zinc-500 uppercase tracking-widest">Active Worker Nodes</div>
        <div class="text-2xl font-bold text-blue-400 mt-1">12 / 12</div>
        <p class="text-xs text-zinc-500 mt-2">Kubernetes cluster connected via gRPC.</p>
      </div>

      <div class="bg-zinc-900 border border-zinc-800 p-4 rounded-lg">
        <div class="text-xs text-zinc-500 uppercase tracking-widest">Tech Stack</div>
        <div class="flex flex-wrap gap-1.5 mt-3">
          <span class="text-[10px] bg-zinc-800 text-zinc-300 px-2 py-0.5 rounded">Go</span>
          <span class="text-[10px] bg-zinc-800 text-zinc-300 px-2 py-0.5 rounded">eBPF</span>
          <span class="text-[10px] bg-zinc-800 text-zinc-300 px-2 py-0.5 rounded">Kafka</span>
          <span class="text-[10px] bg-zinc-800 text-zinc-300 px-2 py-0.5 rounded">gRPC</span>
          <span class="text-[10px] bg-zinc-800 text-zinc-300 px-2 py-0.5 rounded">Docker</span>
        </div>
      </div>
    </div>

    <!-- Live Terminal Feed -->
    <div class="md:col-span-2 bg-zinc-900 border border-zinc-800 rounded-lg p-4 flex flex-col justify-between h-[380px]">
      <div class="flex justify-between items-center pb-2 border-b border-zinc-800 text-xs text-zinc-500">
        <span>LIVE TRAFFIC TELEMETRY</span>
        <span>TCP :443</span>
      </div>
      
      <div id="terminal" class="overflow-y-auto space-y-1 my-2 text-xs text-zinc-400 font-mono pr-2">
        <!-- Log items stream here -->
      </div>

      <div class="pt-2 border-t border-zinc-800 flex justify-between items-center text-[10px] text-zinc-500">
        <span>BUFFER: 256MB</span>
        <span class="text-emerald-500">LISTENING...</span>
      </div>
    </div>

  </main>

  <!-- Script for Live Log Generation -->
  <script>
    const terminal = document.getElementById('terminal');
    const tpsElement = document.getElementById('tps');
    const endpoints = ['/api/v1/auth', '/v2/stream/payload', '/healthz', '/db/query', '/gateway/route'];
    const statuses = [200, 200, 200, 201, 403, 500];
    let msgCount = 0;

    function generateLog() {
      const ep = endpoints[Math.floor(Math.random() * endpoints.length)];
      const status = statuses[Math.floor(Math.random() * statuses.length)];
      const latency = Math.floor(Math.random() * 45) + 2;
      
      let statusColor = 'text-emerald-400';
      if (status >= 400) statusColor = 'text-amber-400';
      if (status >= 500) statusColor = 'text-rose-400';

      const line = document.createElement('div');
      line.className = 'flex space-x-2';
      line.innerHTML = `
        <span class="text-zinc-600">[${new Date().toISOString().split('T')[1].slice(0, 8)}]</span>
        <span class="text-blue-400">INFO</span>
        <span class="${statusColor}">HTTP ${status}</span>
        <span class="text-zinc-300">${ep}</span>
        <span class="text-zinc-500 ml-auto">${latency}ms</span>
      `;

      terminal.appendChild(line);
      msgCount++;
      
      if (terminal.childNodes.length > 14) {
        terminal.removeChild(terminal.firstChild);
      }
    }

    setInterval(generateLog, 300);
    setInterval(() => {
      tpsElement.innerText = (msgCount * 3) + Math.floor(Math.random() * 12);
      msgCount = 0;
    }, 1000);
  </script>
</body>
</html>
